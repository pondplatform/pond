image:
  repository: pond-server
  tag: latest
  pullPolicy: IfNotPresent

listenAddr: ":8080"
managementAddr: ":9090"
databaseUrl: "postgres://pond:pond@postgres:5432/pond?sslmode=disable"
jwtSecret: ""
adminKey: ""

postgres:
  tag: "16-alpine"
  user: pond
  password: pond
  db: pond
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
