image:
  repository: pond-agent
  tag: latest
  pullPolicy: IfNotPresent

serverAddr: "pond-server:8080"
agentToken: ""

serviceAccount:
  create: true
  name: pond-agent

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /states
