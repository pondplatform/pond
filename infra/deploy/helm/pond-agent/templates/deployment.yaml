apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: pond-agent
spec:
  # A cluster has exactly one agent: the server runs the cluster's commands
  # one at a time through it, and its tofu state is on a ReadWriteOnce volume.
  replicas: 1
  # The old pod is shut down before the new one is created. This is not
  # Recreate because Helm's server-side apply can't switch an installed
  # Deployment to it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pond-agent
  template:
    metadata:
      labels:
        app: pond-agent
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: pond-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POND_SERVER_ADDR
              value: {{ .Values.serverAddr | quote }}
            - name: POND_AGENT_TOKEN
              value: {{ .Values.agentToken | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: state
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-state
      {{- end }}
