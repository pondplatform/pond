{{- /* env can carry rendered secrets, so it stays out of the pod spec. */}}
{{- with .Values.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "base-service.fullname" $ }}-env
  labels:
    {{- include "base-service.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := . }}
  {{ $key | quote }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
