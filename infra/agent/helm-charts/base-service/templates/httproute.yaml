{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "base-service.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "base-service.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.rules }}
  rules:
    {{- range . }}
    -
      {{- /* gateway-api rejects a rule that has both a RequestRedirect filter and
             backendRefs, so a redirect rule must not get the service appended. */}}
      {{- $hasRedirect := false }}
      {{- range .filters }}
        {{- if eq (.type | default "") "RequestRedirect" }}
          {{- $hasRedirect = true }}
        {{- end }}
      {{- end }}
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $hasRedirect }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
