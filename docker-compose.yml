services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pond
      POSTGRES_PASSWORD: pond
      POSTGRES_DB: pond
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pond"]
      interval: 2s
      timeout: 5s
      retries: 10

  pond-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      DATABASE_URL: postgres://pond:pond@postgres:5432/pond?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: pond-e2e
