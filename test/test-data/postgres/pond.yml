version: 1
name: postgres-demo
image: ghcr.io/pondplatform/sample-postgres-todo

service:
  port: 3000

dependencies:
  db:
    type: postgres

configs:
  .env:
    format: .env
    mountPath: /usr/src/app/.env
    values:
      DB_HOST: "{{db.host}}"
      DB_PORT: "{{db.port}}"
      DB_USER: "{{db.username}}"
      DB_PASSWORD: "{{db.password}}"
      DB_DATABASE: "{{db.database}}"
