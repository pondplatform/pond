version: 1
name: gateway-demo
# whoami is a tiny HTTP server, enough to show the route serves. The rules and
# filters are what the integration tests check the rendered HTTPRoute against,
# and what the controller has to accept.
image: traefik/whoami

deployment:
  replicas: 1

service:
  port: 80

gateway:
  http:
    enabled: true
    # hostname is deliberately omitted so the derived <name>.<env base host> path
    # is what the test exercises.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /rewritten
        filters:
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplacePrefixMatch
                replacePrefixMatch: /
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Pond-Filter
                  value: applied
      - matches:
          - path:
              type: PathPrefix
              value: /
