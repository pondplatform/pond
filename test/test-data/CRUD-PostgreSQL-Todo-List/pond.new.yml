version: 1
name: todo-app
build: Dockerfile
image: ghcr.io/janmh/todo-app

ingress:
  enabled: true

service:
  port: 3000

dependencies:
  myDb:
    type: postgres
  auth-service:
    type: pond-service
    
env:
  ENVIRONMENT: "testing"

configs:
  .env:
    format: .env
    mountDir: /usr/src/app/
    values:
      DB_HOST: "{{myDb.host}}"
      DB_USER: "{{myDb.secret.username}}"
      DB_PASSWORD: "{{myDb.secret.password}}"
      DB_DATABASE: "{{myDb.secret.database}}"
      DB_PORT: "{{myDb.port}}"

overrides:
  pro: 
    env: 
      ENVIRONMENT: production
    dependencies:
      myDB:
        managed: false
        config:
          host: todo-app-cluster-rw
          port: 5432
